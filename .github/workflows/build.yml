name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x R1XiaozhiApp/gradlew

    - name: Setup Android SDK (platform 22 + build-tools 23.0.3)
      run: |
        set -e
        echo "ANDROID_HOME=$ANDROID_HOME"
        # Ensure build-tools;23.0.3 and platform android;22 are present
        if [ ! -d "$ANDROID_HOME/platforms/android-22" ]; then
          yes | sdkmanager --install "platforms;android-22" || true
        fi
        if [ ! -d "$ANDROID_HOME/build-tools/23.0.3" ]; then
          yes | sdkmanager --install "build-tools;23.0.3" || true
        fi
        echo "Platforms:"
        ls "$ANDROID_HOME/platforms" || true
        echo "Build-tools:"
        ls "$ANDROID_HOME/build-tools" || true
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        cd R1XiaozhiApp
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: List APK files
      run: |
        cd R1XiaozhiApp/app/build/outputs/apk
        find . -name "*.apk" -type f

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: R1Xiaozhi-Debug-APK
        path: R1XiaozhiApp/app/build/outputs/apk/debug/*.apk
        retention-days: 30